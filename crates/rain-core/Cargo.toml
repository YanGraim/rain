[package]
name = "rain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
caseless = "0.2"
serde_json = "1"
thiserror = "2"
rain-platform = { path = "../rain-platform" }
unicode-normalization = "0.1"

[dev-dependencies]
rain-core = { path = ".", features = ["testing"] }
proptest = "1"
tempfile = "3"

[features]
# Exposes in-memory fakes (`FakeFs`, `FixedClock`) to other crates' tests.
testing = []
