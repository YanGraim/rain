[package]
name = "rain-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[target.'cfg(unix)'.dependencies]
# Safe access to the process uids and to process-group kill (tool runner);
# no `unsafe` on our side. Already in the tree; only widened from macOS to unix
# so the runner builds and is tested on Linux CI.
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3"

[features]
# Exposes `FakePlatform` to other crates' tests.
testing = []
