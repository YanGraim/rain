name: CI

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

# Only `push` triggers CI: a PR shows the checks of its head commit, so a
# separate `pull_request` trigger would just run everything twice and leave
# cancelled duplicates in the PR. A newer push to the same branch cancels the
# older run; runs on main are never cancelled so every main commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned by commit SHA; the comment is the tag it resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@7c48f0a661edab95fdc666d1526d9ef945205245 # nextest
      - name: Format
        run: cargo fmt --all --check
      # clippy.toml bans filesystem writes outside explicitly allowed scopes.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --workspace
      # Every clippy.toml entry must actually fire on ci/disallowed-probe.
      - name: Disallowed-methods probe
        shell: bash
        run: ./scripts/check-disallowed.sh
      # Test fakes must never ship in the release binary.
      - name: No test features in release graph
        shell: bash
        run: ./scripts/check-release-features.sh

  # Supply chain: licenses, bans, sources (deny.toml) and RustSec advisories.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Built from source at fixed versions with their own lockfiles.
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit

  nfr:
    name: nfr (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # NFR-003: release binary stays under 15 MB.
      - name: Build release binary
        run: cargo build --locked --release -p rain-cli
      - name: Release binary size
        shell: bash
        run: ./scripts/check-binary-size.sh
      # NFR-006: no network crates in the shipped dependency graph.
      - name: No network crates
        shell: bash
        run: ./scripts/check-no-network.sh
