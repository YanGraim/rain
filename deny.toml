# Supply-chain policy for `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, yanked) fails the check.
yanked = "deny"

[licenses]
# Permissive licenses compatible with the project's MIT license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
